<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - DevHub</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/components.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <header></header>

    <main>
        <div class="container">
            <h1>Study Schedule</h1>

            <div class="schedule-controls">
                <button class="filter-btn active" data-filter="all">All Sessions</button>
                <button class="filter-btn" data-filter="tutoring">Live Tutoring</button>
                <button class="filter-btn" data-filter="study-group">Study Groups</button>
            </div>

            <div class="schedule-list">
                <!-- Session 1 -->
                <div class="session-card" data-category="tutoring">
                    <div class="session-date">
                        <span class="day">15</span>
                        <span class="month">OCT</span>
                    </div>
                    <div class="session-details">
                        <h3>Intro to JavaScript</h3>
                        <p class="time" style="color: var(--text-secondary);">4:00 PM - 5:00 PM</p>
                        <p class="host" style="color: var(--text-secondary);">Hosted by Sarah J.</p>
                        <span class="tag tutoring">Live Tutoring</span>
                    </div>
                    <div style="margin-left: auto;">
                        <button class="btn btn-primary">Join</button>
                    </div>
                </div>

                <!-- Session 2 -->
                <div class="session-card" data-category="study-group">
                    <div class="session-date">
                        <span class="day">16</span>
                        <span class="month">OCT</span>
                    </div>
                    <div class="session-details">
                        <h3>Python Exam Prep</h3>
                        <p class="time" style="color: var(--text-secondary);">6:00 PM - 7:30 PM</p>
                        <p class="host" style="color: var(--text-secondary);">Group Leader: Mike T.</p>
                        <span class="tag study-group">Study Group</span>
                    </div>
                    <div style="margin-left: auto;">
                        <button class="btn btn-primary">Join</button>
                    </div>
                </div>

                <!-- Session 3 -->
                <div class="session-card" data-category="tutoring">
                    <div class="session-date">
                        <span class="day">18</span>
                        <span class="month">OCT</span>
                    </div>
                    <div class="session-details">
                        <h3>CSS Grid Layouts</h3>
                        <p class="time" style="color: var(--text-secondary);">3:30 PM - 4:30 PM</p>
                        <p class="host" style="color: var(--text-secondary);">Hosted by Alex Dev</p>
                        <span class="tag tutoring">Live Tutoring</span>
                    </div>
                    <div style="margin-left: auto;">
                        <button class="btn btn-primary">Join</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer></footer>
</body>
</html>
